<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRAFT PICK</title>
    <link rel="stylesheet" href="../ASSETS/css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: 'Eixample Regular';
        }

        .draft-container {
            width: 398px;
            height: 330px;
        }

        .draft-container .top {
            height: 80px;
            width: 1900px;
            display: flex;
        }

        .draft-container .bottom {
            height: 249px;
            width: 1900px;
            background: #EAFAFF;
        }

        .draft-container .top .left,
        .draft-container .top .right,
        .draft-container .bottom .left,
        .draft-container .bottom .right {
            width: 740px;
        }

        .draft-container .top .left,
        .draft-container .top .right,
        .draft-container .top .mid {
            height: 80px;
        }

        .draft-container .bottom .left,
        .draft-container .bottom .right {
            height: 249px;
        }

        .draft-container .top .coach-container {
            display: flex;
        }

        .draft-container .top .coach-container img {
            height: 25px;
            width: 25px;
        }
    </style>
</head>

<body>
    <div class="draft-container">
        <div class="top">
            <div class="left">
                <div class="coach-container">
                    <img src="../assets/DRAFTPICK/coach-icon.webp" alt="">
                    <div class="coach-name">coach name here</div>
                </div>
                <div class="ban-container">
                    <div class="ban-hero" id="ban1"></div>
                    <div class="ban-hero" id="ban2"></div>
                    <div class="ban-hero" id="ban3"></div>
                    <div class="ban-hero" id="ban4"></div>
                    <div class="ban-hero" id="ban5"></div>
                </div>
            </div>
            <div class="mid"></div>
            <div class="right">
                <div class="coach-container">
                    <div class="coach-name">coach name here</div>
                    <img src="../assets/DRAFTPICK/coach-icon.webp" alt="">
                </div>
            </div>
        </div>
        <div class="bottom">
            <div class="left"></div>
            <div class="mid"></div>
            <div class="right"></div>
        </div>
    </div>
</body>

</html>
