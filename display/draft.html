<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DRAFT PICK</title>
    <link rel="stylesheet" href="../ASSETS/css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: 'Eixample Regular';
        }

        body {
            display: flex;
            justify-content: center;
            background: rgb(0, 91, 26);
            align-items: end;
            height: 100vh;
            overflow: hidden;
            padding-bottom: 25px;
        }

        .draft-container {
            display: flex;
            flex-direction: column;
            margin-bottom: 10px;
            width: 1900px;
            height: 570px;
            gap: 2px
        }

        .draft-container .recap-container {
            display: flex;
            justify-content: space-between;
            width: 1900px;
            height: 195px;
            margin-bottom: 45px;
        }

        .draft-container .recap-container .draft-pick-recap {
            width: 445px;
            height: 100%;
            /* background-color: red; */
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .draft-container .recap-container .draft-pick-recap .top {
            width: 100%;
            height: 40px;
            background: URL('../assets/DRAFTPICK/RECAPDRAFT/BG.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-family: 'Eixample Extrabold';
        }

        .draft-container .recap-container .draft-pick-recap .mid {
            width: 100%;
            height: 110px;
            display: flex;
            gap: 2px;
        }

        .draft-container .recap-container .draft-pick-recap .bottom {
            width: 100%;
            height: 40px !important;
            display: flex;
            gap: 2px;
        }

        .draft-container .recap-container .draft-pick-recap .ban-recap {
            width: 88px;
            height: 40px;
            background-color: black;
        }

        .draft-container .recap-container .draft-pick-recap .pick-recap {
            width: 88px;
            height: 110px;
            background-color: red;
        }

        .draft-container .recap-container .draft-pick-recap .pick-recap,
        .draft-container .recap-container .draft-pick-recap .ban-recap {
            position: relative;
            flex: 1 1 0;
            min-width: 0;
            overflow: hidden;
            background-color: #17191d;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border: 1px solid rgba(255, 255, 255, .12);
            box-sizing: border-box;
        }

        .draft-container .recap-container .draft-pick-recap .pick-recap::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(0, 0, 0, .10), transparent 45%, rgba(0, 0, 0, .45));
            pointer-events: none;
        }

        .recap-role-icon {
            position: absolute;
            z-index: 2;
            top: 5px;
            left: 5px;
            min-width: 24px;
            height: 22px;
            padding: 0 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            background: rgba(12, 18, 28, .88);
            border: 1px solid rgba(255, 255, 255, .65);
            color: #fff;
            font-family: 'Eixample ExtraBold';
            font-size: 10px;
            line-height: 1;
            text-shadow: 0 1px 2px #000;
        }

        .recap-pick-bar,
        .recap-ban-bar {
            position: absolute;
            z-index: 3;
            left: 0;
            right: 0;
            bottom: 0;
            min-height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Eixample ExtraBold';
            font-size: 12px;
            line-height: 1;
            letter-spacing: .3px;
            color: #fff;
            text-shadow: 0 1px 2px rgba(0, 0, 0, .5);
        }

        .recap-pick-bar {
            background: #16a65a;
        }

        .recap-pick-bar.repicked {
            background: #f1c52c;
            color: #151515;
            text-shadow: none;
        }

        .recap-pick-bar.stolen {
            background: #16a65a;
        }

        .recap-pick-bar.empty {
            min-height: 5px;
            height: 5px;
        }

        .recap-ban-bar {
            min-height: 5px;
            height: 5px;
            background: #e53945;
        }

        .recap-ban-bar.empty {
            background: #16a65a;
        }

        .draft-container .recap-container .draft-pick-recap .top {
            gap: 8px;
            padding: 0 8px;
            box-sizing: border-box;
            font-size: 22px;
            white-space: nowrap;
        }

        .recap-team-name {
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 14px;
            opacity: .9;
        }

        .recap-game-number {
            margin-left: 4px;
            font-size: 20px;
        }

        .draft-container .top {
            height: 80px;
            width: 1900px;
            display: flex;
            justify-content: space-between;
        }

        .draft-container .top .left,
        .draft-container .top .right {
            gap: 2px;
        }

        .draft-container .bottom {
            display: flex;
            justify-content: space-between;
            height: 249px;
            width: 1900px;
        }

        .draft-container .bottom .pick-container {
            display: flex;
            gap: 2px;
        }

        .draft-container .bottom .pick-container .pick-hero {
            width: 149px;
            height: 245px;
            background-color: #EAFAFF;
            display: flex;
            flex-direction: column;
        }

        .draft-container .bottom .pick-container .pick-hero .pick-image {
            width: 100%;
            height: 215px;
            background: url('../assets/HEROES/aamon.png');
            background-size: cover;
            background-repeat: no-repeat;
        }

        .draft-container .bottom .pick-container .pick-hero .players-name {
            width: 100%;
            height: calc(245px - 215px);
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Eixample Extrabold';
            text-transform: uppercase;
            border-top: 1px solid #00ac28;
        }

        .draft-container .top .left,
        .draft-container .top .right,
        .draft-container .bottom .left,
        .draft-container .bottom .right {
            width: 740px;
        }

        .draft-container .top .left,
        .draft-container .top .right,
        .draft-container .top .mid {
            height: 80px;
            display: flex;
        }

        .draft-container .bottom .left,
        .draft-container .bottom .right {
            height: 249px;
        }

        .draft-container .top .coach-container {
            padding: 10px;
            width: 330px;
            background: #EAFAFF;
            display: flex;
            gap: 20px;
        }

        .draft-container .top .right {
            flex-direction: row-reverse;
        }

        .draft-container .top .right .coach-container {
            flex-direction: row-reverse;
        }

        .draft-container .top .coach-container img {
            height: 25px;
            width: 25px;
        }

        .draft-container .top .coach-container .coach-name {
            font-size: 50px;
            font-family: 'Eixample Extrabold';
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .draft-container .top .ban-container {
            width: 408px;
            height: 80px;
            gap: 2px;
            display: flex;
        }

        .draft-container .top .ban-container .ban-hero {
            width: 80px;
            height: 80px;
            background: url('../assets/HEROES/aamon-splash.png');
            background-size: cover;
            background-repeat: no-repeat;
        }

        .draft-container .top .ban-container .ban-hero::after {
            content: '';
            width: 80px;
            height: 80px;
            display: block;
            background-image: url('../assets/x.svg');
            background-size: 60%;
            background-repeat: no-repeat;
            background-position: center;
            color: red;
        }

        /* Selected-map banner: image fills the entire top-mid panel, with title overlaid on the right. */
        .draft-container .top .mid {
            width: 398px;
            height: 80px;
            position: relative;
            display: block;
            overflow: hidden;
            padding: 0;
            box-sizing: border-box;
            background: #111820;
        }

        .draft-container .top .mid .selected-map-thumb {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            min-height: 0;
            border-radius: 0;
            overflow: hidden;
            background: #17222a;
            box-shadow: none;
        }

        .draft-container .top .mid .selected-map-thumb::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg,
                    rgba(0, 0, 0, 0) 0%,
                    rgba(0, 0, 0, 0.04) 43%,
                    rgba(0, 0, 0, 0.42) 67%,
                    rgba(0, 0, 0, 0.88) 100%);
            pointer-events: none;
        }

        .draft-container .top .mid .selected-map-thumb img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .draft-container .top .mid .selected-map-info {
            position: absolute;
            z-index: 1;
            top: 0;
            right: 10px;
            bottom: 0;
            width: 43%;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            gap: 2px;
            min-width: 0;
            text-align: right;
            pointer-events: none;
        }

        .draft-container .top .mid .map-label {
            max-width: 100%;
            font-size: 10px;
            line-height: 1.05;
            letter-spacing: 0.8px;
            color: rgba(255, 255, 255, 0.9);
            font-family: 'Eixample Regular';
            font-weight: 700;
            text-transform: uppercase;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }

        .draft-container .top .mid .map-name {
            max-width: 100%;
            font-size: 20px;
            line-height: 0.96;
            color: #fff;
            font-family: 'Eixample Extrabold';
            text-transform: uppercase;
            white-space: normal;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.9);
        }

        .draft-container .bottom .mid {
            width: 398px;
            height: 245px;
            background: url('../assets/DRAFTPICK/bg-middle.png');
            background-size: cover;
            background-repeat: no-repeat;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .draft-container .bottom .mid .progress-bar {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 5px;
            min-height: 5px;
            display: flex;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.22);
        }

        .draft-container .bottom .mid .progress-half {
            width: 50%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .draft-container .bottom .mid .progress-fill {
            width: 100%;
            height: 100%;
            background: #e23636;
            box-shadow: 0 0 8px rgba(226, 54, 54, 0.55);
            transition: transform .95s linear;
            will-change: transform;
        }

        .draft-container .bottom .mid .progress-half.left .progress-fill {
            transform-origin: right center;
            transform: scaleX(var(--progress-scale, 1));
        }

        .draft-container .bottom .mid .progress-half.right .progress-fill {
            transform-origin: left center;
            transform: scaleX(var(--progress-scale, 1));
        }

        .draft-container .bottom .mid .mid-inner {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
            gap: 3px;
            padding: 5px 12px 6px;
            box-sizing: border-box;
        }

        .draft-container .bottom .mid .center-stack-top {
            flex: 0 0 auto;
        }

        .draft-container .bottom .mid .center-stack-bottom {
            flex: 0 0 auto;
            gap: 2px;
        }

        /* Podium hierarchy: MPL logo first, timer/arrow second, teams on one shared baseline below. */
        .draft-container .bottom .mid .center-stack {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 3px;
            text-align: center;
        }

        .draft-container .bottom .mid .league-logo {
            width: 76px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1b1f25;
            font-family: 'Eixample Extrabold';
            font-size: 22px;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: radial-gradient(circle at center, rgba(255, 255, 255, .98) 0%, rgba(245, 248, 252, .95) 65%, rgba(232, 238, 244, .92) 100%);
            clip-path: polygon(50% 0%, 88% 20%, 100% 56%, 77% 100%, 23% 100%, 0% 56%, 12% 20%);
            box-shadow: 0 2px 10px rgba(0, 0, 0, .12);
            flex: 0 0 auto;
        }

        .draft-container .bottom .mid .timer-row {
            /* Three fixed columns keep the timer exactly centered. The arrow occupies
               a side column and never participates in the timer's centering. */
            display: grid;
            grid-template-columns: minmax(42px, 1fr) auto minmax(42px, 1fr);
            align-items: center;
            justify-items: center;
            column-gap: 0;
            min-height: 57px;
            width: 100%;
        }

        .draft-container .bottom .mid .timer {
            grid-column: 2;
            grid-row: 1;
            justify-self: center;
            font-size: 54px;
            line-height: 0.9;
            color: #101114;
            font-family: 'Eixample Extrabold';
            font-variant-numeric: tabular-nums;
            min-width: 2ch;
            text-align: center;
            z-index: 1;
        }

        .draft-container .bottom .mid .phase-arrow {
            grid-row: 1;
            justify-self: center;
            display: block;
            width: 42px;
            height: 30px;
            object-fit: contain;
            background: transparent;
            transform: none;
            transition: none;
            z-index: 2;
            opacity: 0;
        }

        .draft-container .bottom .mid .phase-arrow-left {
            grid-column: 1;
            transform: none;
        }

        .draft-container .bottom .mid .phase-arrow-right {
            grid-column: 3;
            transform: rotate(180deg);
        }

        .draft-container .bottom .mid .phase-arrow.active {
            opacity: 1;
        }

        .draft-container .bottom .mid .phase-label {
            min-height: 12px;
            font-size: 10px;
            line-height: 1;
            color: #5a6472;
            font-family: 'Eixample Regular';
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .draft-container .bottom .mid .mid-teams {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 2px;
        }

        .draft-container .bottom .mid .team-side {
            flex: 1 1 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-align: center;
            height: 80px;
        }

        .draft-container .bottom .mid .team-side.right {
            flex-direction: column;
        }

        .draft-container .bottom .mid .team-logo {
            width: 80px;
            height: 80px;
            /* border-radius: 50%; */
            background: rgba(255, 255, 255, 0.96);
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex: 0 0 30px;
        }

        .draft-container .bottom .mid .team-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .draft-container .bottom .mid .team-logo .logo-fallback {
            font-family: 'Eixample Extrabold';
            font-size: 14px;
            color: #16181d;
            text-transform: uppercase;
        }

        .draft-container .bottom .mid .team-name {
            font-size: 16px;
            line-height: 1;
            color: #15161b;
            font-family: 'Eixample Extrabold';
            text-transform: uppercase;
            white-space: nowrap;
        }

        .draft-container .bottom .mid .score-boxes {
            display: flex;
            gap: 3px;
            flex: 0 0 auto;
        }

        .draft-container .bottom .mid .score-box {
            width: 13px;
            height: 8px;
            background: #d8dde3;
        }

        .draft-container .bottom .mid .score-box.active {
            background: #e23636;
        }

        .draft-container .bottom .mid .match-meta {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            margin-top: auto;
            padding-top: 2px;
        }

        .draft-container .bottom .mid .match-text {
            font-size: 17px;
            color: #17181c;
            font-family: 'Eixample Extrabold';
            text-transform: uppercase;
        }

        .draft-container .bottom .mid .sponsor-text {
            font-size: 15px;
            color: #17181c;
            font-family: 'Eixample Extrabold';
            text-transform: none;
        }

        /* PICK-CARD ACTIVE TURN ANIMATION */
        .draft-container .bottom .pick-container {
            width: 740px;
            max-width: 740px;
            min-width: 0;
            box-sizing: border-box;
            display: flex;
            gap: 2px;
            overflow: hidden;
        }

        .draft-container .bottom .pick-container .pick-hero {
            width: 148px;
            min-width: 0;
            flex: 1 1 148px;
            box-sizing: border-box;
            overflow: hidden;
            transition: flex-basis 280ms cubic-bezier(.22, .75, .25, 1),
                width 280ms cubic-bezier(.22, .75, .25, 1);
            will-change: flex-basis;
        }

        .draft-container .bottom .pick-container .pick-hero.is-active-pick {
            width: 170px;
            flex: 0 0 170px;
        }

        .draft-container .bottom .pick-container .pick-hero .pick-image {
            width: 100%;
            min-width: 0;
            position: relative;
            overflow: hidden;
        }

        /* PICK-CARD ROLE + PLAYER REVEAL ANIMATION */
        .draft-container .bottom .pick-container {
            width: 740px;
            max-width: 740px;
            min-width: 0;
            box-sizing: border-box;
            display: flex;
            gap: 2px;
            overflow: hidden;
        }

        .draft-container .bottom .pick-container .pick-hero {
            width: 148px;
            min-width: 0;
            flex: 1 1 148px;
            box-sizing: border-box;
            overflow: hidden;
            transition:
                flex-basis 300ms cubic-bezier(.22, .75, .25, 1),
                width 300ms cubic-bezier(.22, .75, .25, 1);
            will-change: flex-basis;
        }

        /* Keep the established 170px active-pick behavior. */
        .draft-container .bottom .pick-container .pick-hero.is-active-pick {
            width: 170px;
            flex: 0 0 170px;
        }

        .draft-container .bottom .pick-container .pick-hero .pick-image {
            width: 100%;
            min-width: 0;
            height: 215px;
            position: relative;
            overflow: hidden;
            isolation: isolate;
            background-color: #eafaff;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Large role icon is the default placeholder, centered in the image area. */
        .draft-container .bottom .pick-container .player-role-icon {
            position: absolute;
            z-index: 4;
            left: 50%;
            top: 50%;
            width: 84px;
            height: 84px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #63d8d0;
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
            transform-origin: top left;
            filter: drop-shadow(0 2px 3px rgba(17, 86, 91, .10));
            transition:
                left 520ms cubic-bezier(.22, 1, .36, 1),
                top 520ms cubic-bezier(.22, 1, .36, 1),
                width 520ms cubic-bezier(.22, 1, .36, 1),
                height 520ms cubic-bezier(.22, 1, .36, 1),
                transform 520ms cubic-bezier(.22, 1, .36, 1),
                opacity 220ms ease;
            pointer-events: none;
        }

        .draft-container .bottom .pick-container .player-role-icon svg {
            display: block;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .draft-container .bottom .pick-container .player-role-icon[hidden] {
            display: none;
        }

        /* Player portrait is mounted immediately but stays below the image until reveal. */
        .draft-container .bottom .pick-container .player-photo {
            position: absolute;
            z-index: 3;
            left: 50%;
            bottom: 0;
            width: 100%;
            height: 100%;
            max-width: 100%;
            display: block !important;
            object-fit: contain;
            object-position: center bottom;
            opacity: 0;
            visibility: hidden;
            transform: translate(-50%, 110%);
            transform-origin: center bottom;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .14));
            transition:
                transform 560ms cubic-bezier(.22, .8, .25, 1),
                opacity 420ms ease,
                visibility 0s linear 560ms;
            pointer-events: none;
        }

        /* Reveal is triggered by the active pick turn, not by hero selection. */
        .draft-container .bottom .pick-container .pick-hero.is-revealed .player-role-icon {
            left: 8px;
            top: 8px;
            width: 30px;
            height: 30px;
            transform: translate(0, 0) scale(1);
        }

        .draft-container .bottom .pick-container .pick-hero.is-revealed.has-player-photo .player-photo {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, 0);
            transition:
                transform 560ms cubic-bezier(.22, .8, .25, 1),
                opacity 420ms ease,
                visibility 0s;
        }

        .draft-container .bottom .pick-container .pick-hero .players-name {
            min-width: 0;
            box-sizing: border-box;
            padding: 0 5px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            font-size: 16px;
        }

        .draft-container .bottom .pick-container .pick-hero .player-name-text {
            min-width: 0;
            max-width: 100%;
            flex: 0 1 auto;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            text-align: center;
        }

        /* END PICK-CARD ROLE + PLAYER REVEAL ANIMATION */
    </style>
    <script src="../shared/sync-client.js"></script>
</head>

<body>
    <div class="draft-container">
        <div class="recap-container">
            <div class="draft-pick-recap left">
                <div class="top">
                    <span>DRAFT PICK RECAP</span>
                    <span class="recap-team-name" id="recap-left-team-name">BLUE TEAM</span>
                    <span class="recap-game-number" id="recap-game-number">GAME 1</span>
                </div>
                <div class="mid">
                    <div class="pick-recap"></div>
                    <div class="pick-recap"></div>
                    <div class="pick-recap"></div>
                    <div class="pick-recap"></div>
                    <div class="pick-recap"></div>
                </div>
                <div class="bottom">
                    <div class="ban-recap"></div>
                    <div class="ban-recap"></div>
                    <div class="ban-recap"></div>
                    <div class="ban-recap"></div>

    <script>
        // Display receiver. Control and display must be served from the same origin.
        // BroadcastChannel is primary; localStorage events/state provide a fallback.
        const DRAFT_SYNC_CHANNEL_NAME = 'mlbb-draft-sync-v1';
        const DRAFT_SYNC_STORAGE_KEY = 'mlbb-draft-sync-state-v1';
        const draftSyncChannel = ('BroadcastChannel' in window)
            ? new BroadcastChannel(DRAFT_SYNC_CHANNEL_NAME)
            : null;

        const draftMidPanel = document.getElementById('draft-mid-panel');
        const timerValue = document.getElementById('draft-timer-value');
        const phaseLabel = document.getElementById('draft-phase-label');
        const arrowLeft = document.getElementById('draft-phase-arrow-left');
        const arrowRight = document.getElementById('draft-phase-arrow-right');
        const mapThumbEl = document.getElementById('selected-map-thumb');
        let lastReceivedState = null;

        function setImageBackground(element, imageUrl, fallback = 'none') {
            if (!element) return;
            if (imageUrl) {
                const safeUrl = String(imageUrl).replace(/["\\\\]/g, '\\\\$&');
                element.style.backgroundImage = `url("${safeUrl}")`;
                element.style.backgroundSize = 'cover';
                element.style.backgroundPosition = 'center';
                element.style.backgroundRepeat = 'no-repeat';
            } else {
                element.style.backgroundImage = fallback;
            }
        }

        function setHeroImage(element, hero) {
            if (!element) return;
            const imageUrl = hero && hero.image ? hero.image : '';
            setImageBackground(element, imageUrl, 'none');
            element.dataset.heroName = hero && hero.name ? hero.name : '';
            element.setAttribute('aria-label', hero && hero.name ? hero.name : 'Empty hero slot');
        }

        function setTeamLogo(side, team) {
            const teamSide = document.querySelector(`.draft-container .bottom .mid .team-side.${side}`);
            const img = teamSide && teamSide.querySelector('.team-logo img');
            const fallback = teamSide && teamSide.querySelector('.logo-fallback');
            if (!img || !fallback) return;

            if (team && team.logo) {
                img.src = team.logo;
                img.alt = team.name || `${side} team logo`;
                img.style.display = 'block';
                fallback.style.display = 'none';
            } else {
                img.removeAttribute('src');
                img.style.display = 'none';
                fallback.textContent = (team && team.name ? team.name : side).slice(0, 2).toUpperCase();
                fallback.style.display = 'block';
            }
        }

        function setScoreBoxes(side, score, bestOf) {
            const container = document.getElementById(side === 'left' ? 'team-left-score' : 'team-right-score');
            if (!container) return;
            const bo = Number(bestOf) || 3;
            const maxWins = Math.max(1, Math.ceil(bo / 2));
            const wins = Math.max(0, Math.min(maxWins, Number(score) || 0));
            container.replaceChildren();
            for (let i = 0; i < maxWins; i++) {
                const box = document.createElement('span');
                box.className = 'score-box' + (i < wins ? ' active' : '');
                container.appendChild(box);
            }
        }

        function renderArrowSide(side) {
            // Both videos stay in fixed positions. Only active state changes instantly.
            // Last Change is neutral, so both indicators are active.
            arrowLeft.classList.toggle('active', side === 'left' || side === 'both');
            arrowRight.classList.toggle('active', side === 'right' || side === 'both');
        }

        function updateBanSide(side, bans) {
            const nodes = Array.from(document.querySelectorAll(
                `.draft-container .top .${side} .ban-container .ban-hero`
            ));
            // Right-side control slots are visually arranged 5→1 from left to right.
            const ordered = side === 'right' ? [...bans].reverse() : bans;
            nodes.forEach((node, index) => setHeroImage(node, ordered[index] || null));
        }

        const ROLE_ICON_SVGS = {
            jungler: `<svg viewBox="0 0 100 100" aria-hidden="true"><path fill="currentColor" d="M79 9C48 9 22 22 15 49 9 72 24 90 45 86c25-5 38-31 34-77Z"/><path d="M20 78C37 54 53 37 77 16" fill="none" stroke="#eafaff" stroke-width="5" stroke-linecap="round"/><path d="M43 54c-1-11-8-18-17-22M55 42c10 0 17 4 22 11" fill="none" stroke="#eafaff" stroke-width="4" stroke-linecap="round"/></svg>`,
            roam: `<svg viewBox="0 0 100 100" aria-hidden="true"><path fill="currentColor" d="M50 7 86 21v25c0 22-13 38-36 51C27 84 14 68 14 46V21L50 7Z"/><path d="m31 51 13 13 27-30" fill="none" stroke="#eafaff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
            exp: `<svg viewBox="0 0 100 100" aria-hidden="true"><path fill="currentColor" d="M67 7 88 28 45 71 24 50 67 7Z"/><path fill="currentColor" d="m17 56 27 27-9 9L8 65l9-9Z"/><path fill="currentColor" d="m22 80 8 8-13 7-2-2 7-13Z"/><path d="m45 71 10 10" fill="none" stroke="#eafaff" stroke-width="5" stroke-linecap="round"/></svg>`,
            gold: `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="39" fill="currentColor"/><circle cx="50" cy="50" r="28" fill="none" stroke="#eafaff" stroke-width="5"/><path fill="#eafaff" d="m50 27 7 15 16 2-12 11 3 16-14-8-14 8 3-16-12-11 16-2 7-15Z"/></svg>`,
            mid: `<svg viewBox="0 0 100 100" aria-hidden="true"><path fill="currentColor" d="m50 5 12 29 31 3-24 20 8 31-27-17-27 17 8-31L7 37l31-3L50 5Z"/><circle cx="50" cy="49" r="10" fill="#eafaff"/></svg>`
        };

        function normalizeRoleKey(role) {
            const value = String(role || '').trim().toLowerCase();
            if (value === 'jungler' || value === 'jungle' || value === 'jg') return 'jungler';
            if (value === 'roam' || value === 'roamer' || value === 'tank') return 'roam';
            if (value === 'exp' || value === 'exp lane' || value === 'explaner') return 'exp';
            if (value === 'gold' || value === 'gold lane' || value === 'goldlaner') return 'gold';
            if (value === 'mid' || value === 'mid lane' || value === 'midlaner') return 'mid';
            return '';
        }

        function ensureRoleIcon(image, role) {
            if (!image) return;
            let icon = image.querySelector('.player-role-icon');
            if (!icon) {
                icon = document.createElement('div');
                icon.className = 'player-role-icon';
                image.appendChild(icon);
            }

            const roleKey = normalizeRoleKey(role);
            icon.hidden = !roleKey;
            icon.dataset.role = roleKey;
            icon.setAttribute('aria-label', role ? `${role} role` : 'Player role not assigned');
            icon.title = role || '';
            const svg = ROLE_ICON_SVGS[roleKey] || '';
            if (icon.innerHTML !== svg) icon.innerHTML = svg;
        }

        function getPlayerPhotoUrl(player) {
            if (!player || typeof player !== 'object') return '';
            return player.photo || player.photoUrl || player.portrait || player.image || '';
        }

        function updatePickSide(side, picks, players) {
            const nodes = Array.from(document.querySelectorAll(
                `.draft-container .bottom .${side} .pick-container .pick-hero`
            ));
            // Left visual order is 1→5; right visual order is 5→1.
            const orderedPicks = side === 'right' ? [...picks].reverse() : picks;
            const orderedPlayers = side === 'right' ? [...players].reverse() : players;

            nodes.forEach((node, index) => {
                const image = node.querySelector('.pick-image');
                const name = node.querySelector('.players-name');
                const hero = orderedPicks[index] || null;
                const player = orderedPlayers[index] || null;
                const playerName = typeof player === 'string'
                    ? player
                    : (player && player.name ? player.name : '');
                const playerRole = player && typeof player === 'object' ? (player.role || '') : '';
                const photoUrl = getPlayerPhotoUrl(player);

                // Hero artwork remains the card background; role and portrait are separate layers.
                setHeroImage(image, hero);
                ensureRoleIcon(image, playerRole);

                if (image) {
                    let photo = image.querySelector('.player-photo');
                    if (!photo) {
                        photo = document.createElement('img');
                        photo.className = 'player-photo';
                        photo.alt = '';
                        photo.loading = 'eager';
                        photo.decoding = 'async';
                        image.appendChild(photo);
                    }

                    if (photoUrl) {
                        if (photo.getAttribute('src') !== photoUrl) {
                            photo.onload = () => node.classList.add('has-player-photo');
                            photo.onerror = () => node.classList.remove('has-player-photo');
                            photo.src = photoUrl;
                        }
                        photo.alt = playerName ? `${playerName} photo` : 'Player photo';
                        // Data URLs are already available immediately; normal URLs add the class on load.
                        if (photo.complete && photo.naturalWidth > 0) {
                            node.classList.add('has-player-photo');
                        } else if (String(photoUrl).startsWith('data:image/')) {
                            node.classList.add('has-player-photo');
                        }
                    } else {
                        if (photo.hasAttribute('src')) photo.removeAttribute('src');
                        photo.alt = '';
                        node.classList.remove('has-player-photo');
                    }
                }

                if (name) {
                    let nameText = name.querySelector('.player-name-text');
                    if (!nameText) {
                        name.replaceChildren();
                        nameText = document.createElement('span');
                        nameText.className = 'player-name-text';
                        name.appendChild(nameText);
                    }
                    if (nameText.textContent !== playerName) nameText.textContent = playerName;
                }
            });
        }


        function updateActivePickCards(state) {
            const allCards = document.querySelectorAll(
                '.draft-container .bottom .pick-container .pick-hero'
            );

            // Always clear the previous turn first. Ban and Last Change stay at normal width.
            allCards.forEach(card => card.classList.remove('is-active-pick'));

            if (!state || state.phase !== 'pick' || state.complete) return;

            const side = state.side === 'right' ? 'right'
                : state.side === 'left' ? 'left'
                    : null;
            if (!side) return;

            // Labels are supplied by the existing DRAFT_SEQUENCE, e.g.
            // "BLUE TEAM · PICK 1" or "RED TEAM · PICK 1 + 2".
            const match = String(state.label || '').match(/\bPICK\s+(\d+)(?:\s*\+\s*(\d+))?/i);
            if (!match) return;

            const activeSlots = new Set(
                [Number(match[1]), match[2] ? Number(match[2]) : null]
                    .filter(number => Number.isInteger(number) && number >= 1 && number <= 5)
            );

            const sideCards = Array.from(document.querySelectorAll(
                '.draft-container .bottom .' + side + ' .pick-container .pick-hero'
            ));

            sideCards.forEach((card, visualIndex) => {
                // Blue/left is rendered in logical order 1→5.
                // Red/right is rendered in reverse visual order 5→1.
                const logicalSlot = side === 'right'
                    ? sideCards.length - visualIndex
                    : visualIndex + 1;

                if (activeSlots.has(logicalSlot)) {
                    card.classList.add('is-active-pick');
                }
            });
        }


        function updatePickRevealStates(state) {
            const allCards = Array.from(document.querySelectorAll(
                '.draft-container .bottom .pick-container .pick-hero'
            ));

            allCards.forEach(card => {
                const image = card.querySelector('.pick-image');
                const heroName = image ? (image.dataset.heroName || '') : '';
                const hasHero = Boolean(heroName);
                const isActiveTurn = Boolean(
                    state && state.phase === 'pick' && !state.complete &&
                    card.classList.contains('is-active-pick')
                );
                const roleIcon = image && image.querySelector('.player-role-icon');
                const roleKey = roleIcon ? (roleIcon.dataset.role || '') : '';
                const photo = image && image.querySelector('.player-photo');
                const photoUrl = photo ? (photo.getAttribute('src') || '') : '';
                const shouldReveal = isActiveTurn || hasHero;

                if (!shouldReveal) {
                    card.classList.remove('is-revealed');
                    delete card.dataset.revealKey;
                    delete card.dataset.revealPendingKey;
                    return;
                }

                // Active pick cards reveal after the width transition has completed.
                // Already-picked cards stay revealed when the turn moves elsewhere.
                const revealKey = [heroName, roleKey, photoUrl, isActiveTurn ? 'active' : 'locked'].join('|');
                if (card.classList.contains('is-revealed')) {
                    // Keep a revealed card stable across timer ticks and unrelated state updates.
                    card.dataset.revealKey = revealKey;
                    return;
                }

                if (card.dataset.revealPendingKey === revealKey) return;
                card.dataset.revealPendingKey = revealKey;
                const delay = isActiveTurn ? 320 : 20;
                window.setTimeout(() => {
                    if (!card.isConnected || card.dataset.revealPendingKey !== revealKey) return;
                    card.classList.add('is-revealed');
                    card.dataset.revealKey = revealKey;
                    delete card.dataset.revealPendingKey;
                }, delay);
            });
        }

        function setRecapCardBackground(node, hero) {
            if (!node) return;
            node.replaceChildren();
            node.style.backgroundImage = hero && hero.image
                ? `url("${String(hero.image).replace(/["\\]/g, '\\$&')}")`
                : 'none';
            node.style.backgroundColor = hero && hero.image ? '#17191d' : '#22252b';
        }

        function renderDraftRecap(recap) {
            if (!recap || recap.type !== 'mlbb-draft-recap') return;

            const recapContainer = document.querySelector('.draft-container .recap-container');
            if (recapContainer) recapContainer.style.display = 'flex';

            const gameLabel = document.getElementById('recap-game-number');
            const leftTeamLabel = document.getElementById('recap-left-team-name');
            const rightTeamLabel = document.getElementById('recap-right-team-name');
            if (gameLabel) gameLabel.textContent = `GAME ${recap.gameNumber || 1}`;
            if (leftTeamLabel) leftTeamLabel.textContent =
                (recap.teams && recap.teams.left && recap.teams.left.name) || 'BLUE TEAM';
            if (rightTeamLabel) rightTeamLabel.textContent =
                (recap.teams && recap.teams.right && recap.teams.right.name) || 'RED TEAM';

            for (const side of ['left', 'right']) {
                const panel = document.querySelector(`.draft-pick-recap.${side}`);
                if (!panel) continue;

                const pickNodes = Array.from(panel.querySelectorAll('.pick-recap'));
                const banNodes = Array.from(panel.querySelectorAll('.ban-recap'));
                const sideHeroes = recap.heroes && recap.heroes[side] ? recap.heroes[side] : {};
                const picks = Array.isArray(sideHeroes.pick) ? sideHeroes.pick : [];
                const bans = Array.isArray(sideHeroes.ban) ? sideHeroes.ban : [];

                pickNodes.forEach((node, index) => {
                    const hero = picks[index] || null;
                    setRecapCardBackground(node, hero);

                    if (!hero) return;

                    if (hero.role) {
                        const role = document.createElement('span');
                        role.className = 'recap-role-icon';
                        const roleLabels = {
                            Jungler: 'JG',
                            Roam: 'RO',
                            EXP: 'EXP',
                            Gold: 'GOLD',
                            Mid: 'MID'
                        };
                        role.textContent = roleLabels[hero.role] || String(hero.role).slice(0, 4).toUpperCase();
                        role.title = hero.role;
                        node.appendChild(role);
                    }

                    const bar = document.createElement('span');
                    const status = String(hero.status || '').toUpperCase();
                    bar.className = 'recap-pick-bar';
                    if (status === 'REPICKED') {
                        bar.classList.add('repicked');
                        bar.textContent = 'REPICKED';
                    } else if (status === 'STOLEN') {
                        bar.classList.add('stolen');
                        bar.textContent = 'STOLEN';
                    } else {
                        bar.classList.add('empty');
                        bar.textContent = '';
                    }
                    node.appendChild(bar);
                    node.title = `${hero.name || ''}${status ? ` · ${status}` : ''}`;
                });

                banNodes.forEach((node, index) => {
                    const hero = bans[index] || null;
                    setRecapCardBackground(node, hero);
                    if (!hero) return;

                    const bar = document.createElement('span');
                    bar.className = 'recap-ban-bar';
                    bar.title = 'BANNED';
                    node.appendChild(bar);
                    node.title = `${hero.name || ''} · BANNED`;
                });
            }
        }

        function applyDraftState(state) {
            if (!state || state.type !== 'mlbb-draft-state') return;
            lastReceivedState = state;

            const left = state.teams && state.teams.left ? state.teams.left : {};
            const right = state.teams && state.teams.right ? state.teams.right : {};
            const leftName = document.getElementById('team-left-name');
            const rightName = document.getElementById('team-right-name');

            if (leftName) leftName.textContent = left.name || 'BLUE';
            if (rightName) rightName.textContent = right.name || 'RED';
            setTeamLogo('left', left);
            setTeamLogo('right', right);

            const bestOf = Number(state.bestOf) || 3;
            setScoreBoxes('left', left.score, bestOf);
            setScoreBoxes('right', right.score, bestOf);

            const coachEls = {
                left: document.querySelector('.draft-container .top .left .coach-name'),
                right: document.querySelector('.draft-container .top .right .coach-name')
            };
            if (coachEls.left) coachEls.left.textContent = left.coach || '';
            if (coachEls.right) coachEls.right.textContent = right.coach || '';

            const heroes = state.heroes || {};
            const players = state.players || {};
            updateActivePickCards(state);
            for (const side of ['left', 'right']) {
                const sideHeroes = heroes[side] || {};
                updateBanSide(side, sideHeroes.ban || []);
                updatePickSide(side, sideHeroes.pick || [], players[side] || []);
            }
            // Run reveal after player portraits and role icons exist in the DOM.
            updatePickRevealStates(state);

            timerValue.textContent = String(Math.max(0, Math.floor(Number(state.remaining) || 0))).padStart(2, '0');
            phaseLabel.textContent = state.label || (state.phase || 'DRAFT').replace('-', ' ').toUpperCase();
            renderArrowSide(state.side || 'left');

            const duration = Math.max(1, Number(state.duration) || 45);
            const remaining = Math.max(0, Math.min(duration, Number(state.remaining) || 0));
            draftMidPanel.style.setProperty('--progress-scale', remaining / duration);

            if (state.matchText) {
                const match = document.getElementById('draft-match-text');
                if (match) match.textContent = state.matchText;
            }
            if (state.sponsorText) {
                const sponsor = document.getElementById('draft-sponsor-text');
                if (sponsor) sponsor.textContent = state.sponsorText;
            }
            if (state.map && state.map.name) {
                const mapName = document.getElementById('selected-map-name');
                if (mapName) mapName.textContent = state.map.name;
                const mapImage = mapThumbEl && mapThumbEl.querySelector('img');
                if (mapImage && state.map.image) mapImage.src = state.map.image;
            }

            document.documentElement.dataset.draftSync = 'connected';
        }

        if (draftSyncChannel) {
            draftSyncChannel.addEventListener('message', event => applyDraftState(event.data));
        }

        window.addEventListener('storage', event => {
            if (event.key !== DRAFT_SYNC_STORAGE_KEY || !event.newValue) return;
            try { applyDraftState(JSON.parse(event.newValue)); } catch (error) {
                console.warn('[Draft Display] Invalid saved state', error);
            }
        });

        try {
            const saved = localStorage.getItem(DRAFT_SYNC_STORAGE_KEY);
            if (saved) applyDraftState(JSON.parse(saved));
        } catch (error) {
            console.warn('[Draft Display] Could not read saved state', error);
        }
    </script>


    <script>
        // Terima state draft dari server.
        if (window.MLBBOverlaySync &&
            typeof applyDraftState === 'function') {
            window.MLBBOverlaySync.subscribe('draft', payload => {
                applyDraftState(payload);
            });
        }

        if (window.MLBBOverlaySync &&
            typeof renderDraftRecap === 'function') {
            window.MLBBOverlaySync.subscribe('draft-recap', payload => {
                renderDraftRecap(payload);
            });
        }
    </script>
</body>

</html>
