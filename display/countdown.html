<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Countdown</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            background-color: #fff;
        }

        body {
            font-family: 'Poppins', sans-serif;
            padding: 50px;
        }

        .upper {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 20px;
        }

        .icon {
            width: 165px;
        }

        .icon img {
            width: 100%;
            height: 100%;
        }

        .text {
            font-weight: 500;
            font-size: 12px;
            color: #BAC0CB;
            letter-spacing: 5px;
        }

        .line {
            width: 2px;
            height: 54px;
            background-color: #2b2b2b;
        }

        .middle .timer-caster {
            display: grid;
            grid-template-columns: 590px 1fr;
            gap: 65px;
            height: 165px;
            align-items: center;
        }

        .middle .timer-caster .timer {
            font-size: 110px;
            text-align: center;
            font-family: 'Anton', sans-serif;
            color: #0071B3;
        }
    </style>
</head>

<body>
    <div class="upper">
        <div class="icon">
            <img src="../ASSETS/mlbb-logo.png" alt="">
        </div>
        <div class="line"></div>
        <div class="text">
            <p>PROFESSIONAL ESPORT</br>TOURNAMENT</p>
        </div>
    </div>
    <div class="middle">
        <div class="timer-caster">
            <div class="timer">59:59</div>
            <div class="caster">
                <p>Caster Lineup</p>
                <div class="frame">
                    <img src="" alt="">
                    <h3 class="caster-name"></h3>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
