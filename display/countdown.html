<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display Countdown</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
        }

        body {
            background: url('../ASSETS/BG-PREMIUM-NAVY.png');
            background-size: cover;
            background-position: top;
            background-repeat: no-repeat;
            font-family: 'Poppins', sans-serif;
            padding: 50px;
            max-width: 1920px;
            max-height: 1080px;
            overflow: hidden;
        }

        body::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }

        .upper {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 20px;
        }

        .icon {
            width: 200px;
        }

        .icon img {
            width: 100%;
            height: 100%;
        }

        .text {
            font-weight: 500;
            font-size: 12px;
            color: #BAC0CB;
            letter-spacing: 5px;
        }

        .line {
            width: 2px;
            height: 60px;
            background-color: #2b2b2b;
        }

        .middle .timer-caster {
            display: grid;
            grid-template-columns: 650px 1fr;
            gap: 65px;
            height: 248px;
            align-items: center;
            margin-bottom: 50px;
        }

        .middle .timer-caster .timer {
            font-size: 150px;
            text-align: center;
            font-family: 'Anton', sans-serif;
            color: #64CFFD;
            filter: drop-shadow(0 0 10px rgb(100, 207, 253, 0.3)) drop-shadow(0 0 20px rgb(100, 207, 253, 0.3));
        }

        .middle .timer-caster .caster {
            display: flex;
            gap: 70px;
        }

        .middle .timer-caster .caster p {
            color: #64CFFD;
            letter-spacing: 5px;
            display: flex;
            align-items: center;
        }

        .middle .timer-caster .caster .frame {
            height: 215px;
            width: 170px;
            border: 1px solid #64CFFD;
        }

        .middle .timer-caster .caster .frame .card {
            height: 170px;
            border-bottom: 1px solid #64CFFD;
            background-image: url(../ASSETS/CASTERS/BG-CASTER.png);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            overflow: hidden;
        }

        .middle .timer-caster .caster .frame .card img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: bottom;
        }

        .middle .timer-caster .caster .frame .name {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 27px;
            color: #64CFFD;
            font-weight: 500;
            font-family: 'Anton', sans-serif;
            letter-spacing: 4px;
        }

        .middle .team-ads {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .middle .team-ads .team-schedule {
            display: flex;
            flex-direction: column;
            height: 570px;
            width: 650px;
            gap: 45px;
            backdrop-filter: blur(10px);
        }

        .middle .team-ads .team-schedule .match {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 160px;
            width: 100%;
            background: url(../ASSETS/COUNTDOWN/INACTIVE-MATCH.png);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .middle .team-ads .team-schedule .match.active {
            background: url(../ASSETS/COUNTDOWN/ACTIVE-MATCH.png);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .middle .team-ads .team-schedule .match .detail {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            width: 470px;
            height: 110px;
            color: #b6b6b6;
        }

        .middle .team-ads .team-schedule .match .detail.active {
            color: #64CFFD;
        }

        .middle .team-ads .team-schedule .match .detail .team {
            width: 80px;
            height: 108px;
        }

        .middle .team-ads .team-schedule .match .detail .team img {
            width: 80px;
            height: 80px;
            object-fit: contain;
        }

        .middle .team-ads .team-schedule .match .detail .team .team-name {
            letter-spacing: 2px;
            margin-top: -10px;
            text-align: center;
            font-family: 'poppins', sans-serif;
            font-weight: 500;
            font-style: italic;
            font-size: 23px;
        }

        .middle .team-ads .team-schedule .match .detail .score {
            display: flex;
            justify-content: center;
            align-items: center;
            width: auto;
            height: 108px;
            font-family: 'Anton', sans-serif;
            font-size: 90px;
        }

        .middle .team-ads .team-schedule .match .detail .match-info {
            text-align: center;
            font-family: 'poppins', sans-serif;
        }

        .middle .team-ads .team-schedule .match .detail .match-info .bo,
        .middle .team-ads .team-schedule .match .detail .match-info .clock {
            font-size: 13px;
            font-weight: 300;
        }

        .middle .team-ads .team-schedule .match .detail .match-info .versus {
            font-size: 40px;
            font-weight: 700;
            font-style: italic;
        }

        .middle .team-ads .arrow-container {
            position: relative;
            height: 570px;
            width: 158px;
        }

        .middle .team-ads .arrow-container .arrow {
            position: absolute;
            width: 0;
            height: 0;
            border-top: 27px solid transparent;
            border-bottom: 27px solid transparent;
            border-right: 47px solid #65DDFB;
            top: 0;
            left: 50px;
            margin: 0;
            transform: translateY(53px);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            filter: drop-shadow(0 0 10px rgba(100, 207, 253, 0.5));
        }

        .middle .team-ads .ads-container {
            position: relative;
            height: 570px;
            width: 1013px;
            background: url(../ASSETS/ADS-CONTAINER.png);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .middle .team-ads .ads-container img,
        .middle .team-ads .ads-container video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }
    </style>
</head>

<body>
    <div class="upper">
        <div class="icon">
            <img src="../ASSETS/mlbb-logo.png" alt="MLBB Logo">
        </div>
        <div class="line"></div>
        <div class="text">
            <p>PROFESSIONAL ESPORT<br>TOURNAMENT</p>
        </div>
    </div>
    <div class="middle">
        <div class="timer-caster">
            <div class="timer" id="timer-display">59:59</div>
            <div class="caster" id="casters-wrap">
                <p>CASTER LINEUP</p>
                <div class="frame" id="caster-frame-0">
                    <div class="card">
                        <img id="caster-img-0" src="../ASSETS/CASTERS/ContohCaster.png" alt="Caster 1">
                    </div>
                    <div class="name" id="caster-name-0">DINO</div>
                </div>
                <div class="frame" id="caster-frame-1">
                    <div class="card">
                        <img id="caster-img-1" src="../ASSETS/CASTERS/ContohCaster.png" alt="Caster 2">
                    </div>
                    <div class="name" id="caster-name-1">DINO</div>
                </div>
                <div class="frame" id="caster-frame-2">
                    <div class="card">
                        <img id="caster-img-2" src="../ASSETS/CASTERS/ContohCaster.png" alt="Caster 3">
                    </div>
                    <div class="name" id="caster-name-2">DINO</div>
                </div>
            </div>
        </div>
        <div class="team-ads">
            <div class="team-schedule" id="team-schedule">
                <div class="match active" id="match-card-0" data-match="0">
                    <div class="detail active">
                        <div class="team left">
                            <img class="team-logo-a" src="../ASSETS/TEAMS/evos.png" alt="Team A">
                            <div class="team-name team-name-a">EVOS</div>
                        </div>
                        <div class="score left score-a">0</div>
                        <div class="match-info">
                            <p class="bo bo-text">Best Of 3</p>
                            <p class="versus">VS</p>
                            <p class="clock clock-text">16.00 WIB</p>
                        </div>
                        <div class="score right score-b">0</div>
                        <div class="team right">
                            <img class="team-logo-b" src="../ASSETS/TEAMS/rrq.webp" alt="Team B">
                            <div class="team-name team-name-b">RRQ</div>
                        </div>
                    </div>
                </div>
                <div class="match" id="match-card-1" data-match="1">
                    <div class="detail">
                        <div class="team left">
                            <img class="team-logo-a" src="../ASSETS/TEAMS/evos.png" alt="Team A">
                            <div class="team-name team-name-a">ONIC</div>
                        </div>
                        <div class="score left score-a">0</div>
                        <div class="match-info">
                            <p class="bo bo-text">Best Of 3</p>
                            <p class="versus">VS</p>
                            <p class="clock clock-text">19.00 WIB</p>
                        </div>
                        <div class="score right score-b">0</div>
                        <div class="team right">
                            <img class="team-logo-b" src="../ASSETS/TEAMS/rrq.webp" alt="Team B">
                            <div class="team-name team-name-b">GEEK</div>
                        </div>
                    </div>
                </div>
                <div class="match" id="match-card-2" data-match="2">
                    <div class="detail">
                        <div class="team left">
                            <img class="team-logo-a" src="../ASSETS/TEAMS/evos.png" alt="Team A">
                            <div class="team-name team-name-a">ALTER EGO</div>
                        </div>
                        <div class="score left score-a">0</div>
                        <div class="match-info">
                            <p class="bo bo-text">Best Of 3</p>
                            <p class="versus">VS</p>
                            <p class="clock clock-text">21.00 WIB</p>
                        </div>
                        <div class="score right score-b">0</div>
                        <div class="team right">
                            <img class="team-logo-b" src="../ASSETS/TEAMS/rrq.webp" alt="Team B">
                            <div class="team-name team-name-b">BIGETRON</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="arrow-container">
                <div class="arrow" id="active-arrow"></div>
            </div>
            <div class="ads-container" id="ads-container">
                <img id="ad-img" alt="Advertisement">
                <video id="ad-video" muted loop playsinline></video>
            </div>
        </div>
    </div>

    <script>
        (() => {
            const state = {
                timer: { running: false, left: 3599000, endsAt: 0 },
                activeMatch: 0,
                matches: [
                    { bo: 3, time: '16:00', a: { name: 'EVOS', logo: '../ASSETS/TEAMS/evos.png' }, b: { name: 'RRQ', logo: '../ASSETS/TEAMS/rrq.webp' }, sa: 0, sb: 0 },
                    { bo: 3, time: '19:00', a: { name: 'ONIC', logo: '' }, b: { name: 'GEEK', logo: '' }, sa: 0, sb: 0 },
                    { bo: 3, time: '21:00', a: { name: 'ALTER EGO', logo: '' }, b: { name: 'BIGETRON', logo: '' }, sa: 0, sb: 0 }
                ],
                casters: [
                    { name: 'Caster One', photo: '', visible: true },
                    { name: 'Caster Two', photo: '', visible: true },
                    { name: 'Caster Three', photo: '', visible: true }
                ],
                ad: { visible: false, url: '', type: 'image' }
            };

            let serverTimeOffset = 0;

            const timerEl = document.getElementById('timer-display');
            const arrowEl = document.getElementById('active-arrow');
            const adImgEl = document.getElementById('ad-img');
            const adVideoEl = document.getElementById('ad-video');
            const scheduleEl = document.getElementById('team-schedule');

            // --- Safe DOM update utilities (prevent flicker/re-rendering) ---
            function updateText(el, text) {
                if (!el) return;
                const str = String(text ?? '');
                if (el.textContent !== str) {
                    el.textContent = str;
                }
            }

            function updateImageSrc(img, src, fallback = '') {
                if (!img) return;
                const target = src || fallback;
                if (!target) {
                    if (img.style.display !== 'none') img.style.display = 'none';
                    return;
                }
                if (img.getAttribute('data-active-src') !== target) {
                    img.setAttribute('data-active-src', target);
                    img.src = target;
                }
                if (img.style.display === 'none') {
                    img.style.display = 'block';
                }
            }

            // --- Timer calculation & formatting ---
            function formatClock(seconds) {
                const safe = Math.max(0, Math.floor(seconds));
                const mins = String(Math.floor(safe / 60)).padStart(2, '0');
                const secs = String(safe % 60).padStart(2, '0');
                return `${mins}:${secs}`;
            }

            function getRemainingSeconds() {
                if (state.timer.running) {
                    const now = Date.now() - serverTimeOffset;
                    const diff = Math.max(0, state.timer.endsAt - now);
                    return Math.ceil(diff / 1000);
                }
                return Math.max(0, Math.ceil((state.timer.left || 0) / 1000));
            }

            function tickTimer() {
                if (timerEl) {
                    updateText(timerEl, formatClock(getRemainingSeconds()));
                }
            }
            setInterval(tickTimer, 100);

            // --- Dynamic Arrow Positioning ---
            function updateArrowPosition(activeIndex) {
                if (!arrowEl) return;
                const matchCards = document.querySelectorAll('.team-schedule .match');
                const clampedIndex = Math.max(0, Math.min(matchCards.length - 1, activeIndex || 0));

                matchCards.forEach((card, idx) => {
                    const isActive = idx === clampedIndex;
                    if (card.classList.contains('active') !== isActive) {
                        card.classList.toggle('active', isActive);
                    }
                    const detail = card.querySelector('.detail');
                    if (detail && detail.classList.contains('active') !== isActive) {
                        detail.classList.toggle('active', isActive);
                    }
                });

                const targetCard = matchCards[clampedIndex];
                let targetY = clampedIndex * 205 + 53;
                if (targetCard) {
                    const cardTop = targetCard.offsetTop;
                    const cardHeight = targetCard.offsetHeight || 160;
                    targetY = cardTop + (cardHeight / 2) - 27;
                }
                const newTransform = `translateY(${targetY}px)`;
                if (arrowEl.style.transform !== newTransform) {
                    arrowEl.style.transform = newTransform;
                }
            }

            // --- Match Setup Render ---
            function renderMatches() {
                const matchCards = document.querySelectorAll('.team-schedule .match');
                state.matches.forEach((m, idx) => {
                    const card = matchCards[idx];
                    if (!card || !m) return;

                    const nameA = card.querySelector('.team-name-a');
                    const nameB = card.querySelector('.team-name-b');
                    const logoA = card.querySelector('.team-logo-a');
                    const logoB = card.querySelector('.team-logo-b');
                    const scoreA = card.querySelector('.score-a');
                    const scoreB = card.querySelector('.score-b');
                    const boText = card.querySelector('.bo-text');
                    const clockText = card.querySelector('.clock-text');

                    updateText(nameA, (m.a && m.a.name) ? m.a.name : 'TEAM A');
                    updateText(nameB, (m.b && m.b.name) ? m.b.name : 'TEAM B');
                    updateImageSrc(logoA, (m.a && m.a.logo) ? m.a.logo : '', '../ASSETS/TEAMS/evos.png');
                    updateImageSrc(logoB, (m.b && m.b.logo) ? m.b.logo : '', '../ASSETS/TEAMS/rrq.webp');
                    updateText(scoreA, (m.sa !== undefined ? m.sa : (m.a ? m.a.score : 0)) || 0);
                    updateText(scoreB, (m.sb !== undefined ? m.sb : (m.b ? m.b.score : 0)) || 0);
                    updateText(boText, `Best Of ${m.bo || 3}`);
                    updateText(clockText, `${m.time || '16.00'} WIB`);
                });

                updateArrowPosition(state.activeMatch);
            }

            // --- Caster Lineup Render ---
            function renderCasters() {
                state.casters.forEach((c, idx) => {
                    const frame = document.getElementById(`caster-frame-${idx}`);
                    const img = document.getElementById(`caster-img-${idx}`);
                    const name = document.getElementById(`caster-name-${idx}`);
                    if (!frame) return;

                    const isVisible = (c && c.visible !== false);
                    const targetDisplay = isVisible ? '' : 'none';
                    if (frame.style.display !== targetDisplay) {
                        frame.style.display = targetDisplay;
                    }

                    if (isVisible) {
                        updateText(name, (c && c.name) ? c.name : 'CASTER');
                        updateImageSrc(img, (c && c.photo) ? c.photo : '', '../ASSETS/CASTERS/ContohCaster.png');
                    }
                });
            }

            // --- Advertisement Render ---
            function renderAds() {
                if (!adImgEl || !adVideoEl) return;
                const ad = state.ad;
                if (ad && ad.visible && ad.url) {
                    if (ad.type === 'video') {
                        adImgEl.style.display = 'none';
                        adVideoEl.style.display = 'block';
                        if (adVideoEl.getAttribute('data-active-src') !== ad.url) {
                            adVideoEl.setAttribute('data-active-src', ad.url);
                            adVideoEl.src = ad.url;
                            adVideoEl.play().catch(() => { });
                        }
                    } else {
                        adVideoEl.pause();
                        adVideoEl.style.display = 'none';
                        updateImageSrc(adImgEl, ad.url);
                    }
                } else {
                    adVideoEl.pause();
                    adVideoEl.style.display = 'none';
                    adImgEl.style.display = 'none';
                }
            }

            // --- Selective State Update (prevents full re-render on timer ticks) ---
            function applyFullState(newState, serverNow) {
                if (!newState) return;
                if (serverNow) {
                    serverTimeOffset = Date.now() - serverNow;
                }

                let matchesDirty = false;
                let castersDirty = false;
                let adsDirty = false;

                if (newState.timer) {
                    state.timer = { ...state.timer, ...newState.timer };
                    tickTimer();
                }

                if (newState.activeMatch !== undefined && state.activeMatch !== +newState.activeMatch) {
                    state.activeMatch = +newState.activeMatch;
                    matchesDirty = true;
                }

                if (Array.isArray(newState.matches)) {
                    state.matches = newState.matches.map((m, i) => ({
                        ...state.matches[i],
                        ...m
                    }));
                    matchesDirty = true;
                }

                if (Array.isArray(newState.casters)) {
                    state.casters = newState.casters.map((c, i) => ({
                        ...state.casters[i],
                        ...c
                    }));
                    castersDirty = true;
                }

                if (newState.ad) {
                    state.ad = { ...state.ad, ...newState.ad };
                    adsDirty = true;
                }

                if (matchesDirty) renderMatches();
                if (castersDirty) renderCasters();
                if (adsDirty) renderAds();
            }

            // Sync channel between tabs & preview iframe
            const channel = new BroadcastChannel('mlbb_countdown_channel');
            channel.onmessage = (event) => {
                if (event.data && event.data.type !== 'REQUEST_STATE') {
                    applyFullState(event.data);
                }
            };

            // WebSocket sync for persistence / remote / OBS
            function connectWebSocket() {
                try {
                    const host = location.host || 'localhost:3000';
                    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
                    const ws = new WebSocket(`${protocol}//${host}`);

                    ws.onmessage = (event) => {
                        try {
                            const data = JSON.parse(event.data);
                            if (data.type === 'state' && data.state && data.state.countdown) {
                                const cd = data.state.countdown;
                                applyFullState({
                                    timer: cd.timer,
                                    activeMatch: cd.activeMatch !== undefined ? cd.activeMatch : (cd.matches ? cd.matches.findIndex(m => m.active) : 0),
                                    matches: cd.matches,
                                    casters: cd.casters,
                                    ad: cd.ad || (cd.playlist && cd.playlist[0] ? { visible: cd.playing, url: cd.playlist[0].url, type: cd.playlist[0].type } : null)
                                }, data.now);
                            }
                        } catch (err) { }
                    };

                    ws.onclose = () => {
                        setTimeout(connectWebSocket, 2000);
                    };
                } catch (e) {
                    setTimeout(connectWebSocket, 3000);
                }
            }
            connectWebSocket();

            // Initial render
            window.addEventListener('DOMContentLoaded', () => {
                renderMatches();
                renderCasters();
                renderAds();
                updateArrowPosition(state.activeMatch);
            });
            window.addEventListener('resize', () => {
                updateArrowPosition(state.activeMatch);
            });
        })();
    </script>
</body>

</html>
